var LONGYI=['#2E7A66','#A8392E','#3B5E9E','#B8862E','#7B4F8E','#1F5E68','#3B6B32','#8A2F4E'];

  {k:'long',n:'Long, loose'},{k:'braid',n:'Side braid'},{k:'bob',n:'Bob'}];

function drawPerson(c,step,act){
  var sw=Math.sin(step||0)*9, g='', L=c.longyi, T=c.top, SK=c.skin;
  var hc=c.grey?'#C6C0B6':'#241A14', hc2=c.grey?'#DAD5CD':'#352719';
  var cy=-114, HR=13.2, HRY=14.2;          /* head */
  var shY=-95, waistY=-58, hemY=-4;         /* body */
  var sit = act==='sit';
  if(sit){ shY=-88; waistY=-52; }
  var uid=c._i||0;

  g+=el('defs',{},
    el('linearGradient',{id:'lg'+uid,x1:0,y1:0,x2:1,y2:0},
      el('stop',{offset:'0%','stop-color':'#000','stop-opacity':'.20'})+
      el('stop',{offset:'45%','stop-color':'#000','stop-opacity':'0'})+
      el('stop',{offset:'100%','stop-color':'#000','stop-opacity':'.15'})));
  var SH='url(#lg'+uid+')';

  /* ---- hair that falls behind ---- */
  if(c.hair==='long'){
    g+=el('path',{d:'M'+(-HR-2.5)+' '+(cy-3)+' Q0 '+(cy-HRY-5)+' '+(HR+2.5)+' '+(cy-3)+
      ' L'+(HR+5)+' '+(cy+34)+' Q0 '+(cy+22)+' '+(-HR-5)+' '+(cy+34)+' Z',fill:hc});
  } else if(c.hair==='sadone'){
    g+=el('path',{d:'M'+(-HR-1)+' '+(cy-2)+' Q0 '+(cy-HRY-4)+' '+(HR+1)+' '+(cy-2)+
      ' L'+(HR+2)+' '+(cy+16)+' Q0 '+(cy+8)+' '+(-HR-2)+' '+(cy+16)+' Z',fill:hc});
  }

  /* ---- feet ---- */
  if(!sit){
    if(c.feet==='sneaker'){
      g+=el('path',{d:'M-13 -1 q1 -7 7 -7 q5 0 6 7 q-6 3 -13 0 Z',fill:'#F2EDE4'});
      g+=el('path',{d:'M0 -1 q1 -7 7 -7 q5 0 6 7 q-6 3 -13 0 Z',fill:'#F2EDE4'});
      g+=rect(-13,-1.6,13,2,'#C24A3C',{rx:1});g+=rect(0,-1.6,13,2,'#C24A3C',{rx:1});
    } else {
      g+=el('ellipse',{cx:-6,cy:-1.6,rx:6.4,ry:2.8,fill:'#3E342A'});
      g+=el('ellipse',{cx:6,cy:-1.6,rx:6.4,ry:2.8,fill:'#3E342A'});
    }
  }

  /* ---- longyi / htamein ---- */
  if(sit){
    g+=el('path',{d:'M-14 -26 L-11 '+waistY+' L11 '+waistY+' L14 -26 Q0 -20 -14 -26 Z',fill:L});
    g+=el('path',{d:'M-14 -26 Q0 -20 14 -26 L17 -10 Q0 -4 -17 -10 Z',fill:L});
    g+=el('path',{d:'M-14 -26 Q0 -20 14 -26 L17 -10 Q0 -4 -17 -10 Z',fill:'#000',opacity:.16});
  } else {
    var lon='M-11.5 '+waistY+' L-13.5 '+(hemY-2)+' Q0 '+(hemY+2.5)+' 13.5 '+(hemY-2)+' L11.5 '+waistY+' Z';
    g+=el('path',{d:lon,fill:L});
    if(c.pattern==='stripe'){for(var i=1;i<7;i++)g+=el('path',{d:'M'+(-12+i*3.5)+' '+waistY+' L'+(-13+i*3.9)+' '+hemY,stroke:'#000','stroke-width':1.2,opacity:.15});}
    else if(c.pattern==='check'){
      for(var a=1;a<7;a++)g+=el('path',{d:'M'+(-12+a*3.5)+' '+waistY+' L'+(-13+a*3.9)+' '+hemY,stroke:'#FFF','stroke-width':1,opacity:.2});
      for(var b=1;b<8;b++){var yy=waistY+(hemY-waistY)*b/8;g+=el('path',{d:'M-12.6 '+yy+' Q0 '+(yy+1.2)+' 12.6 '+yy,stroke:'#FFF','stroke-width':1,fill:'none',opacity:.2});}}
    else if(c.pattern==='acheik'){
      for(var w=1;w<6;w++){var wy=waistY+(hemY-waistY)*w/6;
        g+=el('path',{d:'M-12.8 '+wy+' q6.4 -3.6 12.8 0 q6.4 3.6 12.8 0',stroke:'#FFF','stroke-width':1.4,fill:'none',opacity:.3});}}
    else if(c.pattern==='flower'){
      for(var f=0;f<14;f++){var fx=rnd(-10.5,10.5),fy=rnd(waistY+5,hemY-5);
        g+=circ(fx,fy,1.5,'#FFF',{opacity:.4});g+=circ(fx,fy,.6,'#000',{opacity:.15});}}
    g+=el('path',{d:lon,fill:SH});
    g+=el('path',{d:'M-13.4 '+(hemY-6)+' Q0 '+(hemY-2)+' 13.4 '+(hemY-6)+' L13.5 '+(hemY-2)+' Q0 '+(hemY+2.5)+' -13.5 '+(hemY-2)+' Z',fill:'#000',opacity:.16});

  }

  /* ---- top ---- */
  var hemT = sit? waistY+4 : waistY+3;
  var tPath;

  } else if(c.topStyle==='hoodie'){
    tPath='M-12.5 '+shY+' Q0 '+(shY-4)+' 12.5 '+shY+' L14 '+(hemT+4)+' Q0 '+(hemT+8)+' -14 '+(hemT+4)+' Z';

    g+=el('path',{d:'M-9.5 '+(shY-1)+' Q0 '+(shY+9)+' 9.5 '+(shY-1)+' Q0 '+(shY+14)+' -9.5 '+(shY-1)+' Z',fill:'#000',opacity:.18});

    g+=el('path',{d:'M-5.6 '+(shY-1)+' Q0 '+(shY+5)+' 5.6 '+(shY-1)+' Q0 '+(shY+8.6)+' -5.6 '+(shY-1)+' Z',fill:'#000',opacity:.14});
  }
  g+=el('path',{d:tPath,fill:SH,opacity:.85});

  /* ---- arms ---- */
  var ay=shY+5;
  function arm(sx,ex,ey,rot,pivotX){
    return el('path',{d:'M'+sx+' '+ay+' Q'+((sx+ex)/2+(sx<0?-2:2))+' '+((ay+ey)/2)+' '+ex+' '+ey,

      circ(ex,ey+2.2,2.7,SK,{transform:rot!=null?('rotate('+rot+' '+pivotX+' '+ay+')'):null});

  if(act==='pour'){
    g+=arm(-10.5,-28,ay-28);
    g+=arm(10.5,20,ay+24);
    g+=el('path',{d:'M-33 '+(ay-24)+' q6 -9 13 -3 l-2 9 q-8 3 -11 -6 Z',fill:'#C9CED4'});
    g+=el('path',{d:'M15 '+(ay+22)+' q8 -4 12 4 l-2 10 q-8 2 -11 -3 Z',fill:'#C9CED4'});
    g+=el('path',{d:'M-25 '+(ay-20)+' Q-4 '+(ay-2)+' 10 '+(ay+22),stroke:'#DCA45E','stroke-width':2.2,fill:'none',opacity:.9});

    var bob=Math.sin((step||0)*3)*4;

    g+=el('path',{d:'M24 '+(ay-10+bob)+' l9 19',stroke:'#7E5228','stroke-width':2.2,'stroke-linecap':'round'});
  } else if(sit){
    g+=arm(-10.5,-13,ay+19);
    g+=arm(10.5,11,ay+17);
    g+=el('path',{d:'M8 '+(ay+13)+' q5 -3 8 1 l-1.6 6 q-5.4 1.4 -6.4 -2 Z',fill:'#FFFDF6'});
  } else {
    g+=arm(-10.5,-12.5,ay+27,sw*.75,-10.5);
    g+=arm(10.5,12.5,ay+27,-sw*.75,10.5);
    if(c.carry==='phone')g+=rect(10.6,ay+25,4.6,8.6,'#20252B',{rx:1.2,transform:'rotate('+(-sw*.75)+' 10.5 '+ay+')'});
  }

  /* ---- neck + head ---- */
  g+=el('path',{d:'M-3.4 '+(shY-1)+' L-3 '+(cy+11)+' L3 '+(cy+11)+' L3.4 '+(shY-1)+' Z',fill:SK});

  g+=el('path',{d:'M'+(x-9)+' '+y+' L'+x+' '+(y-40)+' L'+(x+9)+' '+y+' Z',fill:K.goldHi});

function stupa(x,y,s){
  /* Shwedagon, built up the way the real one is: the terraces, the bell,
     the turban bands, the inverted alms bowl, the lotus, the banana bud,
     then the hti and the diamond bud right at the top. */
  var g='',yy=y;
  function ring(wBot,wTop,hh,fill){
    var o=el('path',{d:'M'+(x-wBot*s)+' '+yy+' L'+(x+wBot*s)+' '+yy+
      ' L'+(x+wTop*s)+' '+(yy-hh*s)+' L'+(x-wTop*s)+' '+(yy-hh*s)+' Z',fill:fill});
    yy-=hh*s; return o;}

  /* the terraces you climb, square then octagonal, each one set back */
  g+=ring(84,80,13,'#E9DFC8');
  g+=ring(79,75,11,K.goldDeep);
  g+=ring(74,70,13,K.gold);
  g+=ring(69,66,10,K.goldHi);
  g+=ring(65,62,12,K.gold);
  g+=ring(61,58,10,K.goldDeep);

  /* the bell. flares out of the terrace, then a long shoulder inward */
  var bw=58, tw=20, bh=152, bellTop=yy-bh*s;
  g+=el('path',{d:'M'+(x-bw*s)+' '+yy+
    ' C'+(x-bw*1.03*s)+' '+(yy-bh*.40*s)+' '+(x-bw*.72*s)+' '+(bellTop+bh*.20*s)+' '+(x-tw*s)+' '+bellTop+
    ' L'+(x+tw*s)+' '+bellTop+
    ' C'+(x+bw*.72*s)+' '+(bellTop+bh*.20*s)+' '+(x+bw*1.03*s)+' '+(yy-bh*.40*s)+' '+(x+bw*s)+' '+yy+' Z',
    fill:'url(#stupaG)'});
  /* the light that always sits down one side of it */
  g+=el('path',{d:'M'+(x-bw*.80*s)+' '+(yy-6*s)+
    ' C'+(x-bw*.84*s)+' '+(yy-bh*.42*s)+' '+(x-bw*.58*s)+' '+(bellTop+bh*.22*s)+' '+(x-tw*.86*s)+' '+(bellTop+5*s)+
    ' L'+(x-tw*.40*s)+' '+(bellTop+9*s)+
    ' C'+(x-bw*.44*s)+' '+(bellTop+bh*.26*s)+' '+(x-bw*.62*s)+' '+(yy-bh*.42*s)+' '+(x-bw*.58*s)+' '+(yy-6*s)+' Z',
    fill:K.goldHi,opacity:.42});
  yy=bellTop;

  /* the turban: three bands tightening as they go up */
  g+=ring(20,19,8,K.goldDeep);
  g+=ring(19,18,7,K.goldHi);
  g+=ring(18,17,7,K.gold);
  /* the inverted alms bowl */
  g+=el('path',{d:'M'+(x-17*s)+' '+yy+' q'+(17*s)+' '+(-19*s)+' '+(34*s)+' 0 Z',fill:K.goldHi});
  yy-=13*s;
  g+=ring(15,14,5,K.goldDeep);
  /* two rings of lotus petals */
  [[14,8],[12,7]].forEach(function(p){
    var w=p[0]*s,hh=p[1]*s;
    for(var i=-3;i<=3;i++)
      g+=el('path',{d:'M'+(x+i*w/3.5-w/7)+' '+yy+' q'+(w/7)+' '+(-hh*1.35)+' '+(w/3.5)+' 0 Z',
        fill:i%2?K.gold:K.goldHi});
    g+=ring(p[0],p[0]-1,4,K.goldDeep);});

  /* the banana bud, the long taper before the ironwork */
  var bud=42*s;
  g+=el('path',{d:'M'+(x-11*s)+' '+yy+' C'+(x-11*s)+' '+(yy-bud*.62)+' '+(x-3*s)+' '+(yy-bud*.82)+' '+x+' '+(yy-bud)+
    ' C'+(x+3*s)+' '+(yy-bud*.82)+' '+(x+11*s)+' '+(yy-bud*.62)+' '+(x+11*s)+' '+yy+' Z',fill:K.goldHi});
  g+=el('path',{d:'M'+(x-4*s)+' '+yy+' C'+(x-5*s)+' '+(yy-bud*.6)+' '+(x-2*s)+' '+(yy-bud*.8)+' '+(x-0.5*s)+' '+(yy-bud*.94),
    stroke:K.gold,'stroke-width':2.4*s,fill:'none',opacity:.6});
  yy-=bud;

  /* the hti: seven rings of ironwork, hung with bells, narrowing to nothing */
  for(var i=0;i<7;i++){
    var r=(12.5-i*1.5)*s, hh=(6.4-i*.5)*s;
    g+=el('path',{d:'M'+(x-r)+' '+yy+' L'+(x+r)+' '+yy+' L'+(x+r*.58)+' '+(yy-hh)+' L'+(x-r*.58)+' '+(yy-hh)+' Z',
      fill:i%2?K.gold:K.goldHi});
    g+=el('path',{d:'M'+(x-r)+' '+yy+' L'+(x+r)+' '+yy,stroke:K.goldDeep,'stroke-width':Math.max(.6,1*s),opacity:.65});
    yy-=hh+1.4*s;}

  /* the shaft, then the vane and the diamond bud at the very top */
  g+=rect(x-1.8*s,yy-30*s,3.6*s,31*s,K.goldHi);
  for(var v=0;v<3;v++)
    g+=el('ellipse',{cx:x,cy:yy-8*s-v*7*s,rx:(6-v*1.4)*s,ry:(2.4-v*.5)*s,fill:K.gold});
  g+=el('path',{d:'M'+x+' '+(yy-46*s)+' l'+(4.6*s)+' '+(7*s)+' l'+(-4.6*s)+' '+(7.5*s)+' l'+(-4.6*s)+' '+(-7.5*s)+' Z',fill:'#FFF8E2'});
  g+=circ(x,yy-39*s,3*s,'#FFF3D2',{opacity:.55});
  return g;}

/* a tazaung: the little prayer pavilions standing all round the platform */
function tazaung(x,base,s,tiers){
  var g='',w=42*s,y=base;
  g+=rect(x-w,y-72*s,w*2,72*s,'#F2E9D6');
  g+=rect(x-w,y-72*s,w*2,72*s,'#000',{opacity:.05});
  g+=rect(x-w*.34,y-46*s,w*.68,46*s,'#7A5A38');
  g+=el('path',{d:'M'+(x-w*.34)+' '+(y-46*s)+' q'+(w*.34)+' '+(-16*s)+' '+(w*.68)+' 0 Z',fill:'#5C4228'});
  y-=72*s;
  /* the stacked pyatthat roof */
  var n=tiers||4;
  for(var i=0;i<n;i++){
    var rw=w*(1.18-i*0.19), rh=17*s-i*2*s;
    g+=el('path',{d:'M'+(x-rw)+' '+y+' L'+(x+rw)+' '+y+' L'+(x+rw*.42)+' '+(y-rh)+' L'+(x-rw*.42)+' '+(y-rh)+' Z',
      fill:i%2?K.gold:K.goldHi});
    /* the flicks on the corners */
    g+=el('path',{d:'M'+(x-rw)+' '+y+' q'+(-5*s)+' '+(-7*s)+' '+(-2*s)+' '+(-12*s),stroke:K.goldDeep,'stroke-width':2.2*s,fill:'none','stroke-linecap':'round'});
    g+=el('path',{d:'M'+(x+rw)+' '+y+' q'+(5*s)+' '+(-7*s)+' '+(2*s)+' '+(-12*s),stroke:K.goldDeep,'stroke-width':2.2*s,fill:'none','stroke-linecap':'round'});
    y-=rh+2.5*s;}
  g+=el('path',{d:'M'+(x-5*s)+' '+y+' q5 -22 5 -26 q0 4 5 26 Z',fill:K.goldHi});
  g+=circ(x,y-30*s,3.4*s,'#FFF6DA');
  return g;}

/* a row of candles on the marble, the flames breathing slightly out of step */
function candleRow(x0,y,n,gap,t,s){
  var g='';
  for(var i=0;i<n;i++){
    var cx=x0+i*gap, f=0.72+0.28*Math.sin(t*3.1+i*1.7);
    g+=rect(cx-3.4*s,y-15*s,6.8*s,15*s,'#F6EFE0');
    g+=rect(cx-3.4*s,y-15*s,2.2*s,15*s,'#DCD1BC');
    g+=el('ellipse',{cx:cx,cy:y-21*s,rx:3.4*s*f,ry:7*s*f,fill:'#FFD37A',opacity:.95});
    g+=el('ellipse',{cx:cx,cy:y-20*s,rx:1.7*s*f,ry:4*s*f,fill:'#FFF6DC'});
    g+=circ(cx,y-20*s,16*s*f,'#FFC96A',{opacity:.10});}
  return g;}

function sky(t){
  var a,b,u;
  if(S.minutes<540){a=['#5B6E8C','#C98D7E','#F0C08A'];b=['#4C9FD8','#8FC9EB','#DCEEF8'];u=(S.minutes-360)/180;}
  else if(S.minutes<960){a=['#4C9FD8','#8FC9EB','#DCEEF8'];b=a;u=0;}
  else{a=['#4C9FD8','#8FC9EB','#DCEEF8'];b=['#2A3340','#7A5F6B','#E0A05F'];u=(S.minutes-960)/180;}
  u=Math.max(0,Math.min(1,u));
  function mx(p,q,t2){var A=[parseInt(p.slice(1,3),16),parseInt(p.slice(3,5),16),parseInt(p.slice(5,7),16)],
    B=[parseInt(q.slice(1,3),16),parseInt(q.slice(3,5),16),parseInt(q.slice(5,7),16)];
    return 'rgb('+Math.round(A[0]+(B[0]-A[0])*t2)+','+Math.round(A[1]+(B[1]-A[1])*t2)+','+Math.round(A[2]+(B[2]-A[2])*t2)+')';}
  return [mx(a[0],b[0],u),mx(a[1],b[1],u),mx(a[2],b[2],u)];
}

/* ===================== RENDER ===================== */
var t0=performance.now();
function render(){
  var t=(performance.now()-t0)/1000;
  if(S.scene==='candles'){ $('scene').innerHTML=candleScene(t); return; }
  if(S.scene==='served'){ $('scene').innerHTML=servedScene(t); return; }
  var sc=SCENES[S.scene];
  $('scene').innerHTML = sc.kind==='out'?outScene(S.scene,t):inScene(S.scene,t);
}

/* ===================== HUD ===================== */
var toastT;
function toast(m){$('toast').innerHTML=m;$('toast').classList.add('on');
  clearTimeout(toastT);toastT=setTimeout(function(){$('toast').classList.remove('on');},4200);}
function fmt(m){return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');}
function earn(n){S.kyat+=n;var p=$('kyatPill');p.classList.add('flash');setTimeout(function(){p.classList.remove('flash');},700);refresh();}
function addTime(n){S.minutes+=n;if(S.minutes>=19*60&&!S.ended)forceEnd();refresh();}
function refresh(){
  $('clock').textContent=fmt(S.minutes);$('kyat').textContent=money(S.kyat);
  $('whoName').textContent=S.me.name||'·';
  $('cardN').textContent=Object.keys(S.eaten).length+'/'+DISHES.length;
  var sc=SCENES[S.scene];
  $('plT').textContent=sc.t;$('plM').textContent=sc.my;$('plS').textContent=sc.s;
}
function openPanel(h){$('panel').innerHTML=h;$('modal').classList.add('on');
  $('panel').querySelectorAll('[data-close]').forEach(function(b){b.onclick=function(){$('modal').classList.remove('on');};});}

/* ===================== ACTIONS BAR (interiors) ===================== */
function refreshActs(){
  var a=$('acts'),sc=SCENES[S.scene];
  if(!sc||sc.kind!=='in'||S.ended){a.classList.remove('on');a.innerHTML='';return;}
  var sh=INSHOP[S.scene],h='';
  sh.sells.forEach(function(id){
    var d=dishById(id),had=S.eaten[id],gone=d.until&&S.minutes>d.until;
    h+='<button class="act'+(had||gone?'':' go')+'" data-eat="'+id+'"'+(had||gone||S.kyat<d.price?' disabled':'')+'>'+
      (had?'✓ '+d.en:(gone?d.en+', gone':d.en+' · '+money(d.price)))+'</button>';});
  if(sh.job) h+='<button class="act" data-job="'+sh.job+'"'+(S.jobsDone[sh.job]?' disabled':'')+'>'+
    (S.jobsDone[sh.job]?'Shift done':'Ask for a shift')+'</button>';

function servedScene(t){

      el('stop',{offset:'0%','stop-color':'#C9603F'})+el('stop',{offset:'100%','stop-color':'#95412A'}))+
    el('filter',{id:'blurS'},el('feGaussianBlur',{stdDeviation:'14'}))+

      return o;})());
  g+=rect(0,0,VW,900,'#000',{opacity:.18});

  for(var gl=0;gl<7;gl++)g+=el('path',{d:'M'+(240+gl*190)+' 470 L'+(120+gl*250)+' 900',stroke:'#000','stroke-width':2,opacity:.06});
  g+=el('ellipse',{cx:800,cy:640,rx:520,ry:260,fill:'url(#spotG)'});
  /* table things */
  g+=el('g',{transform:'translate(260 560) scale(1.05)'},
    rect(-46,-96,92,110,'#9AA0A8',{rx:5})+rect(-40,-90,26,96,'#C24A3C',{rx:3})+
    rect(-10,-90,22,96,'#4E7A32',{rx:3})+rect(16,-90,22,96,'#E6BC4A',{rx:3})+
    el('ellipse',{cx:0,cy:16,rx:50,ry:12,fill:'#000',opacity:.22}));
  g+=el('g',{transform:'translate(1330 540) scale(1.1)'},
    el('ellipse',{cx:0,cy:60,rx:56,ry:14,fill:'#000',opacity:.22})+
    el('path',{d:'M-44 -70 q44 -14 88 0 l-10 128 q-34 12 -68 0 Z',fill:'#F6F2E4'})+
    el('ellipse',{cx:0,cy:-70,rx:44,ry:13,fill:'#E9E2CE'})+
    el('ellipse',{cx:0,cy:-66,rx:34,ry:9,fill:'#C8DCB8'}));
  g+=el('g',{transform:'translate(1140 792) scale(1)'},chopsticks(0,0,-9));
  /* the bowl, arrives from above, lands with a little settle */
  var arrive=Math.min(1,e/1.05), ease=1-Math.pow(1-arrive,3);
  var drop=(1-ease)*-340, settle=arrive>=1?Math.sin((e-1.05)*13)*Math.max(0,6-(e-1.05)*22):0;
  var eating=V.eatT0!=null, p=eating?Math.min(1,(t-V.eatT0)/1.9):0;
  var bx=800, by=624+drop+settle;

    tx(800,300,money(d.price)+' KYAT',{'font-family':'Martian Mono',fill:'#C9D2D6','font-size':13,'letter-spacing':'4'}));
  g+=vignette();
  return g;

var AC=null,beds={},master=null;
function ensureAudio(){
  if(AC)return AC;
  try{AC=new (window.AudioContext||window.webkitAudioContext)();
    master=AC.createGain();master.gain.value=0.0;master.connect(AC.destination);}catch(e){AC=null;}
  return AC;
}
function noiseBuf(){
  var len=AC.sampleRate*2,b=AC.createBuffer(1,len,AC.sampleRate),d=b.getChannelData(0);
  for(var i=0;i<len;i++)d[i]=(Math.random()*2-1);
  return b;
}
var bedNode=null,pingTimer=null;
function ambient(k){
  if(!S.sound||!ensureAudio())return;
  if(bedNode){try{bedNode.src.stop();}catch(e){}try{if(bedNode.pad)bedNode.pad.stop();}catch(e){}bedNode=null;}
  clearInterval(pingTimer);
  var cfg={street:{lp:760,hp:80,g:.09,ping:'horn'},sule:{lp:1150,hp:95,g:.13,ping:'horn'},
    tea:{lp:2000,hp:340,g:.05,ping:'clink'},zay:{lp:1300,hp:220,g:.07,ping:'chat'},
    rice:{lp:1700,hp:260,g:.05,ping:'clink'},shan:{lp:1800,hp:280,g:.055,ping:'clink'},
    shwe:{lp:520,hp:50,g:.035,ping:'bell'},candles:{lp:460,hp:40,g:.03,ping:'bell'}}[k]||{lp:900,hp:90,g:.07,ping:'horn'};
  var src=AC.createBufferSource();src.buffer=noiseBuf();src.loop=true;
  var hp=AC.createBiquadFilter();hp.type='highpass';hp.frequency.value=cfg.hp;
  var lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=cfg.lp;
  var g=AC.createGain();g.gain.value=cfg.g;
  src.connect(hp);hp.connect(lp);lp.connect(g);g.connect(master);src.start();
  bedNode={src:src,g:g};
  pingTimer=setInterval(function(){
    if(!S.sound||!AC)return;
    var o=AC.createOscillator(),og=AC.createGain();
    var now=AC.currentTime;
    var lp2=AC.createBiquadFilter();lp2.type='lowpass';lp2.frequency.value=2400;
    if(cfg.ping==='horn'){o.type='triangle';o.frequency.value=rnd(150,260);og.gain.setValueAtTime(.028,now);
      og.gain.exponentialRampToValueAtTime(.001,now+.5);lp2.frequency.value=900;}
    else if(cfg.ping==='clink'){o.type='sine';o.frequency.value=rnd(900,1700);og.gain.setValueAtTime(.026,now);
      og.gain.exponentialRampToValueAtTime(.001,now+.5);}
    else if(cfg.ping==='bell'){o.type='sine';o.frequency.value=[392,494,587,659][Math.floor(rnd(0,4))%4];
      og.gain.setValueAtTime(.05,now);og.gain.exponentialRampToValueAtTime(.001,now+4.2);}
    else {o.type='sine';o.frequency.value=rnd(220,420);og.gain.setValueAtTime(.014,now);
      og.gain.exponentialRampToValueAtTime(.001,now+.45);}
    o.connect(lp2);lp2.connect(og);og.connect(master);o.start(now);o.stop(now+4.6);
  }, cfg.ping==='bell'?4200:cfg.ping==='chat'?1500:2600);
  /* a warm pad underneath, quiet */
  if(cfg.ping==='bell'){
    var pad=AC.createOscillator(),pg=AC.createGain();
    pad.type='sine';pad.frequency.value=98;pg.gain.value=.035;
    pad.connect(pg);pg.connect(master);pad.start();
    bedNode.pad=pad;
  }
}

var melTimer=null;
function playClosingMusic(){
  if(S.ownTrack){ try{ var a=new Audio(S.ownTrack); a.volume=.55; a.loop=true; S.ownAudio=a; a.play(); }catch(e){} return; }
  if(!S.sound||!ensureAudio())return;

  var phrase=[['D5',0,1.4],['B4',1.1,1.1],['A4',2.0,1.6],['G4',3.4,1.2],['E4',4.4,2.2],
              ['G4',6.6,1.2],['A4',7.6,1.2],['B4',8.6,1.8],['D5',10.2,2.6],
              ['A4',13.0,1.4],['G4',14.2,1.4],['E4',15.4,3.4]];
  var bass=[['D3',0,7],['A3',7,6],['D3',13,6.4]];
  function note(f,at,dur,gain,type){
    var o=AC.createOscillator(),g2=AC.createGain(),lp=AC.createBiquadFilter();
    lp.type='lowpass';lp.frequency.value=1900;
    o.type=type||'sine';o.frequency.value=f;
    var t0n=AC.currentTime+at;
    g2.gain.setValueAtTime(0,t0n);
    g2.gain.linearRampToValueAtTime(gain,t0n+.18);
    g2.gain.exponentialRampToValueAtTime(.0008,t0n+dur);
    o.connect(lp);lp.connect(g2);g2.connect(master);
    o.start(t0n);o.stop(t0n+dur+.2);
  }
  function cycle(){
    phrase.forEach(function(n){note(NT[n[0]],n[1],n[2],.055,'sine');});
    phrase.forEach(function(n){note(NT[n[0]]*2,n[1]+.06,n[2]*.7,.016,'triangle');});
    bass.forEach(function(n){note(NT[n[0]],n[1],n[2],.045,'sine');});
  }
  cycle();
  clearInterval(melTimer);
  melTimer=setInterval(function(){ if(S.sound&&AC) cycle(); }, 19400);
}

    if(has(['myself','me ','who i','young','child','girl','the person i','before i']))
      return {note:'For yourself, then. That is the hardest one to say out loud, and far more common up here than anybody admits.',
        close:'The girl who left in September is still somewhere on this platform, barefoot and in a hurry, not yet knowing how long it was going to be. You came back for her as much as for anybody. She would be glad it was you who came.'};
    return {note:'Whatever it was, it is on the platform now, in among two hundred others, and nobody is going to ask you to account for it.',
      close:'You did not have to translate it for anybody up here. You wrote it down, you set it burning, and it is standing in among two hundred others now, every one of them somebody else’s reason to come back.'};
  }
  var W = readWish(S.wish), note = W.note, closeLine = W.close;
  /* the middle paragraph has to describe the day that actually happened */
  var didWork = Object.keys(S.jobsDone).length>0, didEat = Object.keys(S.eaten).length>0;
  var wasAbout =
    (didWork && didEat)
      ? 'It was about a morning where nothing has to be explained to you. Ordering in two words without reaching for them. The man at the tea shop already knowing. Standing behind a counter for an hour, and then paying for your own breakfast like anybody else on that street.'
    : (didWork && !didEat)
      ? 'It was about a morning where nothing has to be explained to you. Somebody putting a kettle into your hands without first asking whether you knew what to do with it. Nobody checking on you. Nobody slowing down. You stood behind a counter on that street for an hour and it took you no time at all to remember how.'
    : (!didWork && didEat)
      ? 'It was about a morning where nothing has to be explained to you. Ordering in two words without reaching for them. The man at the tea shop already knowing. Eating standing up because there were no chairs, and nobody thinking to offer you one.'
      : 'It was about a morning where nothing has to be explained to you. Walking a street where not one person looks at you twice. Knowing without checking which side of the road the shade is on. Understanding every word being shouted across you, and not one of them being meant for you.';
  var head = ranOut ? 'The light went while you were still walking' : 'Barefoot, on the warm marble';
  var open = ranOut
    ? 'Seven o’clock found you somewhere between one street and the next. The lamps come on along the stairway while you are still three roads away, and somehow it does not matter the way you thought it would.'
    : 'You leave your slippers at the bottom of the east stairway along with everybody else’s, and you go up. The stone is hot where the sun has been sitting on it and cool in the shade, in stripes, and your feet remember it before you do.';
  var count = n===12
    ? 'All twelve of them, and not one paid for with anybody else’s money. You are going to feel that on the plane and you are not going to mind.'
    : n===0
      ? (S.kyat>0
          ? 'You worked all day and never once sat down to eat. There is '+money(S.kyat)+' kyat folded into your longyi and nothing at all on the card, which is its own kind of Burmese.'
          : 'You did not earn anything and you did not eat anything. You simply walked around all day looking at it, which, after seven years, is not the worst way to spend the light.')
      : n+' of the twelve, earned an hour at a time, with '+money(S.kyat)+' kyat still folded away. The other '+(12-n)+' will keep.';
  var turn = n===0
    ? 'You came back with a list of twelve things and did not sit down for a single one. It turns out the list was never really about the food either.'
    : 'You came back for twelve things, and the list was never really about the food.';
  $('endPanel').innerHTML=
    '<p class="kick">19:00 · ရွှေတိဂုံဘုရား · the day is finished</p>'+
    '<h2>'+head+'</h2>'+
    '<p>'+open+'</p>'+
    '<div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(100px,1fr))">'+
    DISHES.map(function(d){var had=S.eaten[d.id];
      return '<div class="cardCell'+(had?'':' locked')+'" style="padding:7px">'+
        (had?dishArt(d.id,62):'<div class="ghost" style="height:56px">·</div>')+
        '<div class="nm" style="font-size:10.5px">'+d.en+'</div></div>';}).join('')+'</div>'+
    /* the custom first, because it is the setting, not the payoff */
    '<p class="say" style="margin-top:20px">Everybody comes up here before they leave the country. Mothers bring their children the week before a flight and stand them in front of the right corner. Years later the children come back on their own, grown, a little embarrassed, not quite knowing what to say. You were one of those children once. Today you were the one who came back.</p>'+
    /* what the day actually amounted to */
    '<p class="dim" style="margin-top:16px">'+count+'</p>'+
    (S.wish?'<p class="say" style="margin-top:16px;color:#F0C97A;font-size:23px;line-height:1.5">“'+esc(S.wish)+'”</p>'+
      (note?'<p class="dim" style="margin-top:-2px">'+note+'</p>':'')+
      '<p class="dim" style="margin-top:6px">Your candle is in the fourth row. There are two hundred others.</p>':'')+
    /* the turn */
    '<p class="say" style="margin-top:20px">'+turn+'</p>'+
    '<p class="say">'+wasAbout+'</p>'+
    '<p class="say">Tomorrow the city carries on at half past eleven without you, the way it has every day for seven years. That always sounded like the sad part. It is the opposite. It is the only reason there is still somewhere to come back to.</p>'+
    '<p class="say">Nobody could tell you were a guest today, '+name+'.</p>'+
    '<p class="say">'+closeLine+'</p>'+
    /* the closing block */
    '<div style="margin-top:30px;padding-top:24px;border-top:1px solid rgba(243,235,218,.16);text-align:center">'+
    '<p class="say" style="color:#F0C97A;font-size:clamp(20px,2.6vw,27px);line-height:1.55;margin:0 auto;max-width:34ch">'+
    'Home keeps a seat for you.<br>It has not moved.</p>'+
    '<p style="font-family:var(--my);color:#E9C97E;font-size:22px;line-height:1.9;margin-top:16px">မကြာခင် ပြန်တွေ့မယ်</p>'+
    '<p class="dim" style="margin:2px auto 0;font-size:12.5px">See you soon</p>'+
    '</div>'+
    /* what it was made after */
    '<div style="margin-top:26px;padding-top:18px;border-top:1px solid rgba(243,235,218,.1);text-align:center">'+
    '<p class="dim" style="margin:0 auto;max-width:46ch;font-size:12.5px;line-height:1.7">'+
    'Made after listening to <em>Home</em>, written by Dick Lee for Singapore in 1998. '+
    'A song about one country, borrowed for a while by somebody from another. '+
    'Every place should have one.</p></div>'+
    '<div class="row" style="margin-top:24px;justify-content:center"><button class="btn go" id="againBtn">Have the day again</button></div>';
  $('againBtn').onclick=function(){
    try{clearInterval(melTimer);if(S.ownAudio)S.ownAudio.pause();}catch(e){}
    location.reload();};
  $('endScrim').classList.add('on');
}

/* ===================== DRESS UP ===================== */
function intro(){
  function row(l,i){return '<div class="optRow"><label>'+l+'</label>'+i+'</div>';}
  function rowW(l,i){return '<div class="optRow wide"><label>'+l+'</label>'+i+'</div>';}
  $('introPanel').innerHTML=
    '<div class="introGrid"><div class="introStory">'+
    '<p class="kick">Yangon · one morning, and the whole day in front of you</p>'+
    '<h2>I have not been home in seven years.</h2>'+
    '<p>I was born in Yangon and I left in September, thinking I would be back by the following summer. I did not say goodbye to anybody properly, because it did not feel like the kind of leaving that needed one.</p>'+
    '<p>My memory of the city never faded. I can still walk from my house to the tea shop in my head, in the right order, with the right smells. What I lost was the ordinary morning. Ordering tea in two words without thinking about them. Eating standing up because there are no chairs. Somebody straightening my longyi without asking.</p>'+
    '<p class="say" style="margin-top:16px;margin-bottom:0">So I built a morning back. Today it is yours.</p>'+
    '</div><div id="preview"></div></div>'+
    '<div class="opts">'+
      rowW('Your name','<input id="nameIn" maxlength="18" placeholder="e.g. Su Myat" autocomplete="off">')+
      row('Longyi','<div class="swrow" id="lonRow"></div>')+
      row('Pattern','<div class="swrow" id="patRow"></div>')+
      row('Top','<div class="swrow" id="topRow"></div>')+
      row('Cut, old and new','<div class="swrow" id="styRow"></div>')+
      row('Thanaka','<div class="swrow" id="thaRow"></div>')+
      row('Hair','<div class="swrow" id="hairRow"></div>')+
      row('In your hair','<div class="swrow" id="flowRow"></div>')+
      row('Feet','<div class="swrow" id="feetRow"></div>')+
      row('Carrying','<div class="swrow" id="carRow"></div>')+
    '</div>'+
    '<div class="row" style="margin-top:22px;padding-top:18px;border-top:1px solid rgba(42,36,25,.16)">'+
    '<button class="btn go" id="startBtn" disabled>Go down to the street</button>'+
    '<span class="scoreline" id="needName">Put a name in first</span></div>';
  function swatch(id,items,key,col){
    var r=$(id);
    r.innerHTML=items.map(function(it){var v=col?it:it.k,sel=S.me[key]===v?' sel':'';
      return col?'<button class="sw'+sel+'" data-v="'+v+'" style="background:'+v+'"></button>'
                :'<button class="tag'+sel+'" data-v="'+v+'">'+it.n+'</button>';}).join('');
    r.querySelectorAll('button').forEach(function(b){b.onclick=function(){
      r.querySelectorAll('button').forEach(function(c){c.classList.remove('sel');});
      b.classList.add('sel');S.me[key]=b.dataset.v;paint();};});}
  function paint(){$('preview').innerHTML=personSVG(S.me,268,0);}
  swatch('lonRow',LONGYI,'longyi',1);swatch('patRow',PATTERNS,'pattern',0);
  swatch('topRow',TOPS,'top',1);swatch('styRow',TOPSTYLE,'topStyle',0);
  swatch('thaRow',THANAKA,'thanaka',0);swatch('hairRow',HAIR,'hair',0);
  swatch('flowRow',FLOWER,'flower',0);
  swatch('feetRow',FEET,'feet',0);swatch('carRow',CARRY,'carry',0);
  paint();
  $('nameIn').addEventListener('input',function(){
    S.me.name=this.value.trim();$('startBtn').disabled=!S.me.name;
    $('needName').textContent=S.me.name?'Ready':'Put a name in first';refresh();});
  $('nameIn').focus();
  $('startBtn').onclick=howToPlay;
}

/* ===================== HOW TO PLAY ===================== */
function howToPlay(){
  var steps=[
    {n:'၁',h:'You begin with empty pockets',b:'And that is quite all right. Yangon has always kept an hour of work for anybody willing to stand behind a counter, and the people here would far sooner give you a job than give you money.'},
    {n:'၂',h:'So ask somebody for a shift',b:'Walk up to a shop and press <b>E</b> to go inside. Somebody will put a kettle or a cloth into your hands without making a fuss about it. Pull tea on the corner, fold the longyi back into their pile at Bogyoke, help behind the curry cabinet, build bowls at the Shan shop, carry a parcel down to the jetty. One shift in each place is all they will let you do.'},
    {n:'၃',h:'Then sit down and eat',b:'Twelve dishes are waiting for you across seven places, and none of them are going anywhere. Press <b>F</b> whenever you would like to see how the card is filling up.'},
    {n:'၄',h:'The light moves on its own',b:'It is six in the morning now. Everything you do takes a little while, and walking from one place to the next takes a little longer. The only thing that will not wait for you is the mohinga cart, which packs up at nine the way it always did.'},
    {n:'၅',h:'Finish at Shwedagon',b:'Go up the east stairway whenever you have had enough of the day, and light a candle. There is no wrong hour to stop. Staying out until the light goes is its own sort of ending.'}
  ];
  $('introPanel').innerHTML=
    '<p class="kick">How the day goes</p>'+
    '<h2>Take your time. Nothing here is in a hurry.</h2>'+
    '<div style="display:flex;flex-direction:column;gap:14px;margin-top:16px">'+
    steps.map(function(s){
      return '<div style="display:flex;gap:14px;align-items:flex-start">'+
        '<span style="font-family:var(--my);font-size:26px;color:var(--oxide);line-height:1;flex:0 0 auto;min-width:26px">'+s.n+'</span>'+
        '<div><div style="font-weight:800;font-size:15px;margin-bottom:3px">'+s.h+'</div>'+
        '<div class="dim" style="line-height:1.55">'+s.b+'</div></div></div>';}).join('')+
    '</div>'+
    '<div style="margin-top:20px;padding-top:14px;border-top:1px solid rgba(42,36,25,.18)">'+
    '<div class="scoreline" style="margin:0 0 8px">Controls</div>'+
    '<div class="dim" style="line-height:1.7">'+
    '<b>← →</b> or <b>A D</b> walk · <b>click</b> to go there · <b>E</b> use what you are standing at<br>'+
    '<b>M</b> map and travel · <b>F</b> food card · <b>Sound</b> for the street · <b>Photos</b> to put your own Yangon behind the scenes'+
    '</div></div>'+
    '<div class="row" style="margin-top:20px"><button class="btn go" id="reallyStart">Six in the morning, go</button>'+
    '<button class="btn" id="backDress">Change what I am wearing</button></div>';
  $('reallyStart').onclick=function(){
    $('intro').classList.remove('on');
    toast('<b>'+esc(S.me.name)+'</b>, nothing in your pocket. The tea shop is up the street and it is hiring.');
    setTimeout(function(){$('hint').style.opacity='0';},12000);};
  $('backDress').onclick=intro;
}

/* ===================== INPUT & LOOP ===================== */
var keys={};
window.addEventListener('keydown',function(e){
  if(e.target.tagName==='INPUT')return;
  var k=e.key.toLowerCase();keys[k]=true;
  if(k==='m'){$('mapScrim').classList.contains('on')?$('mapScrim').classList.remove('on'):openMap();}
  if(k==='f'){$('cardScrim').classList.contains('on')?$('cardScrim').classList.remove('on'):openCard();}
  if(k==='escape'){['modal','cardScrim','mapScrim','photoScrim'].forEach(function(i){$(i).classList.remove('on');});}
  if(k==='e'){var s=nearSpot();if(s&&!busy()&&!S.ended)useSpot(s);}
  if(k===' ')e.preventDefault();
});
window.addEventListener('keyup',function(e){keys[e.key.toLowerCase()]=false;});
$('stage').addEventListener('click',function(e){
  if(busy()||!SCENES[S.scene]||SCENES[S.scene].kind!=='out')return;
  var W=SCENES[S.scene].w,pan=Math.max(0,Math.min(W-VW,S.x-VW/2));
  var sc2=Math.max(window.innerWidth/VW,window.innerHeight/VH),visW=window.innerWidth/sc2;
  S.walkTo=Math.max(60,Math.min(W-60,(VW-visW)/2+(e.clientX/window.innerWidth)*visW+pan));
});
function busy(){return ['modal','cardScrim','mapScrim','photoScrim','intro','endScrim'].some(function(i){return $(i).classList.contains('on');});}
function nearSpot(){
  var l=SPOTS[S.scene]||[];
  for(var i=0;i<l.length;i++)if(Math.abs(S.x-l[i].x)<95)return l[i];
  return null;
}
function useSpot(sp){
  S.walkTo=null;
  if(sp.end){ending(false);return;}
  if(sp.go){goTo(sp.go);return;}
  if(sp.job){JOBS[sp.job]();return;}
  if(sp.sells){
    var rows=sp.sells.map(function(id){
      var d=dishById(id),had=S.eaten[id],gone=d.until&&S.minutes>d.until;
      return '<div class="menuRow"><div>'+dishArt(id,72)+'</div><div class="txt">'+
        '<p class="myn">'+d.my+'</p><div class="en">'+d.en+'</div><div class="ds">'+d.taste+'</div></div>'+
        '<div class="act2"><div class="scoreline" style="margin:0 0 6px">'+money(d.price)+' kyat</div>'+
        (had?'<span class="scoreline" style="color:#2E7A4E">eaten ✓</span>'
          :gone?'<span class="scoreline" style="color:#B9503F">gone by nine</span>'
          :'<button class="btn go sm" data-eat="'+id+'"'+(S.kyat<d.price?' disabled':'')+'>'+(S.kyat<d.price?'No kyat':'Order it')+'</button>')+
        '</div></div>';}).join('');
    openPanel('<p class="kick">'+SCENES[S.scene].t+'</p><h2 class="my">'+sp.my+'</h2>'+
      '<p class="dim" style="margin-top:-4px">'+sp.label+'</p>'+rows+
      '<div class="row" style="margin-top:14px"><button class="btn" data-close>Walk on</button></div>');
    $('panel').querySelectorAll('[data-eat]').forEach(function(b){b.onclick=function(){eat(b.dataset.eat);};});
  }
}
function loop(){
  requestAnimationFrame(loop);
  var sc=SCENES[S.scene];
  if(sc && sc.kind==='out'){
    var sp=0;
    if(!busy()){
      if(keys['arrowright']||keys['d'])sp=1;
      else if(keys['arrowleft']||keys['a'])sp=-1;
      else if(S.walkTo!==null){var d=S.walkTo-S.x;if(Math.abs(d)<6)S.walkTo=null;else sp=d>0?1:-1;}
    }
    if(sp!==0){S.x=Math.max(60,Math.min(sc.w-60,S.x+sp*4));S.facing=sp;S.step+=0.2;}
    else S.step*=0.86;
    var st=nearSpot(),p=$('prompt');
    if(st&&!busy()&&!S.ended){
      p.innerHTML=st.label+', <b>E</b> to '+(st.end?'go up':st.go?'go in':st.job?'ask for work':'see what there is');
      p.classList.add('on');
    } else p.classList.remove('on');
  }
  var now=performance.now();
  if(now-lastDraw>42){ lastDraw=now; render(); }
}
var lastDraw=0;

intro();refresh();refreshActs();loop();
})();
</script>
