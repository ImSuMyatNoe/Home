<title>Home</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gloock&family=Manrope:wght@400;500;600;700;800&family=Martian+Mono:wght@300;400;500&family=Noto+Sans+Myanmar:wght@400;600&display=swap">

<style>
:root{
  --oxide:#A8392E;--brick:#C6552B;--gold:#E9B949;--goldHi:#F7DA8C;--jade:#2E7A66;
  --bone:#F3EBDA;--paper:#FCF6E9;--ink:#2A2419;--night:#0B0F13;
  --display:"Gloock",Georgia,serif;--sans:"Manrope","Helvetica Neue",Arial,sans-serif;
  --mono:"Martian Mono",ui-monospace,Menlo,monospace;--my:"Noto Sans Myanmar","Padauk",sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--night);color:#F3EBDA;font-family:var(--sans);overflow:hidden;-webkit-font-smoothing:antialiased}
#stage{position:fixed;inset:0;overflow:hidden;cursor:pointer}
#scene{position:absolute;inset:0;width:100%;height:100%;display:block;transition:opacity .45s}
#stage.fading #scene{opacity:0}

#hud{position:fixed;inset:0;z-index:4;pointer-events:none}
#hud>*{pointer-events:auto}
#bar{position:absolute;top:0;left:0;right:0;padding:13px 16px;display:flex;justify-content:space-between;
  align-items:flex-start;gap:10px;background:linear-gradient(rgba(11,15,19,.68),transparent);flex-wrap:wrap}
#barL,#barR{display:flex;gap:7px;flex-wrap:wrap;align-items:flex-start}
.pill{display:flex;align-items:center;gap:7px;background:rgba(14,19,25,.8);border:1px solid rgba(243,235,218,.16);
  border-radius:999px;padding:7px 13px;backdrop-filter:blur(8px)}
.pill .k{font-family:var(--mono);font-size:8px;letter-spacing:.16em;text-transform:uppercase;color:#96A1AB}
.pill .v{font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums}
.pill.money .v{color:var(--gold)}
.pill.money.flash .v{color:#8DE0A0}
.pill.who .v{font-family:var(--sans);font-weight:700;font-size:12.5px}
.hbtn{font-family:var(--sans);font-weight:700;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;
  background:rgba(14,19,25,.8);color:#F3EBDA;border:1px solid rgba(243,235,218,.2);border-radius:999px;
  padding:9px 14px;cursor:pointer;backdrop-filter:blur(8px)}
.hbtn:hover{border-color:var(--gold);color:var(--gold)}
.hbtn b{color:var(--gold)}
.hbtn.on{border-color:var(--gold);color:var(--gold)}

#place{position:absolute;left:18px;top:58px;max-width:min(330px,60vw)}
#place .t{font-family:var(--display);font-size:clamp(20px,2.6vw,28px);line-height:1.1;
  text-shadow:0 2px 14px rgba(0,0,0,.6)}
#place .m{font-family:var(--my);font-size:14px;color:var(--gold);line-height:1.9;text-shadow:0 2px 10px rgba(0,0,0,.7)}
#place .s{font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:#B9C2C8;margin-top:5px;
  text-shadow:0 2px 8px rgba(0,0,0,.8)}

#prompt{position:absolute;left:50%;bottom:82px;transform:translateX(-50%);background:rgba(14,19,25,.9);
  border:1px solid rgba(233,185,73,.5);border-radius:999px;padding:10px 19px;font-size:13px;font-weight:600;
  backdrop-filter:blur(8px);opacity:0;transition:opacity .18s;max-width:92vw;text-align:center}
#prompt.on{opacity:1}
#prompt b{color:var(--gold)}
#hint{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);font-family:var(--mono);font-size:8.5px;
  letter-spacing:.15em;text-transform:uppercase;color:#8C97A1;transition:opacity .6s;text-align:center;max-width:92vw}
#toast{position:absolute;left:50%;top:88px;transform:translateX(-50%);background:rgba(14,19,25,.94);
  border-left:3px solid var(--gold);border-radius:4px;padding:11px 16px;font-size:13px;max-width:min(410px,92vw);
  opacity:0;transition:opacity .28s;backdrop-filter:blur(8px)}
#toast.on{opacity:1}
#toast b{color:var(--gold)}

#acts{position:absolute;left:50%;bottom:26px;transform:translateX(-50%);display:none;gap:8px;flex-wrap:wrap;
  justify-content:center;max-width:94vw}
#acts.on{display:flex}
.act{font-family:var(--sans);font-size:12.5px;font-weight:700;padding:11px 18px;border-radius:999px;cursor:pointer;
  border:1px solid rgba(243,235,218,.25);background:rgba(14,19,25,.86);color:#F3EBDA;backdrop-filter:blur(8px);transition:.15s}
.act:hover{border-color:var(--gold);color:var(--gold)}
.act.go{background:var(--gold);color:#1A1407;border-color:var(--gold)}
.act.go:hover{background:var(--goldHi);color:#1A1407}
.act[disabled]{opacity:.35;cursor:not-allowed}

.scrim{position:fixed;inset:0;z-index:9;background:rgba(8,11,15,.9);backdrop-filter:blur(4px);
  display:none;align-items:center;justify-content:center;padding:20px 12px;overflow-y:auto}
.scrim.on{display:flex}
.panel{max-width:660px;width:100%;background:var(--paper);color:var(--ink);border-radius:5px;
  padding:26px clamp(16px,4vw,34px) 24px;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.panel.wide{max-width:960px}
.kick{font-family:var(--mono);font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:#96897A;margin:0 0 8px}
.panel h2{font-family:var(--display);font-size:clamp(22px,4vw,31px);line-height:1.12;margin:0 0 10px;text-wrap:balance}
.panel p{font-size:14.5px;line-height:1.62;margin:0 0 12px;max-width:58ch}
.panel p.say{font-family:var(--display);font-size:17.5px;line-height:1.48;color:#4A3F2E}
.dim{color:#7C7160;font-size:13px}
.myname{font-family:var(--my);font-size:20px;line-height:1.6;color:var(--oxide);margin:0 0 2px}
.row{display:flex;gap:9px;flex-wrap:wrap;margin-top:10px;align-items:center}
.btn{font-family:var(--sans);font-size:12.5px;font-weight:700;padding:10px 17px;border-radius:999px;cursor:pointer;
  border:1px solid rgba(42,36,25,.28);background:transparent;color:var(--ink);transition:.15s}
.btn:hover{border-color:var(--oxide);color:var(--oxide)}
.btn.go{background:var(--oxide);color:#FFF3E4;border-color:var(--oxide)}
.btn.go:hover{background:#C24A3C;color:#fff}
.btn.sm{font-size:11.5px;padding:8px 13px}
.btn[disabled]{opacity:.34;cursor:not-allowed}
.btn.sel{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-top:10px}
.choice{text-align:left;padding:11px 13px;border:1px solid rgba(42,36,25,.22);border-radius:5px;background:#fff;
  cursor:pointer;transition:.14s;font-family:var(--sans);color:var(--ink)}
.choice:hover{border-color:var(--oxide)}
.choice.sel{border-color:var(--oxide);background:#FBEDE4;box-shadow:inset 0 0 0 1px var(--oxide)}
.choice .bg{display:block;font-size:14px;font-weight:700;margin-bottom:2px}
.choice .sm{display:block;font-size:11.5px;color:#7C7160;line-height:1.35}

.menuRow{display:flex;gap:13px;align-items:center;padding:11px 0;border-top:1px solid rgba(42,36,25,.13)}
.menuRow .txt{flex:1 1 150px;min-width:140px}
.menuRow .myn{font-family:var(--my);font-size:16px;color:var(--oxide);line-height:1.7;margin:0}
.menuRow .en{font-weight:800;font-size:14.5px}
.menuRow .ds{font-size:12px;color:#7C7160;line-height:1.45;margin-top:2px}
.menuRow .act2{flex:0 0 auto;text-align:right;min-width:108px}

/* opening screen: story beside the figure, then the options across the full width */
.introGrid{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:34px;align-items:center;margin-top:6px}
.introStory p{max-width:none}
.introStory h2{margin-bottom:14px}
#preview{background:linear-gradient(#F0E8D8,#DCD0B8);border:1px solid rgba(42,36,25,.16);border-radius:10px;
  display:flex;align-items:center;justify-content:center;min-height:340px;position:relative;overflow:hidden}
#preview:after{content:'';position:absolute;left:50%;bottom:42px;transform:translateX(-50%);
  width:120px;height:14px;border-radius:50%;background:rgba(42,36,25,.18);filter:blur(4px)}
#preview svg{position:relative;z-index:1;margin-bottom:18px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px 30px;
  margin-top:24px;padding-top:22px;border-top:1px solid rgba(42,36,25,.16)}
.optRow.wide{grid-column:1/-1}
@media (max-width:860px){.introGrid{grid-template-columns:1fr;gap:22px}#preview{min-height:280px;order:-1}}
.optRow>label{display:block;font-family:var(--mono);font-size:8.5px;letter-spacing:.16em;text-transform:uppercase;color:#96897A;margin-bottom:5px}
.swrow{display:flex;gap:6px;flex-wrap:wrap}
.sw{width:29px;height:29px;border-radius:6px;border:2px solid rgba(42,36,25,.18);cursor:pointer;transition:.13s;padding:0}
.sw:hover{transform:translateY(-2px)}
.sw.sel{border-color:var(--ink);box-shadow:0 0 0 3px rgba(42,36,25,.15)}
.tag{font-family:var(--sans);font-size:11px;font-weight:600;padding:6px 11px;border-radius:999px;cursor:pointer;
  border:1px solid rgba(42,36,25,.22);background:#fff;color:var(--ink);transition:.13s}
.tag:hover{border-color:var(--oxide)}
.tag.sel{background:var(--jade);border-color:var(--jade);color:#fff}
#nameIn{font-family:var(--sans);font-size:16px;font-weight:700;padding:10px 13px;border-radius:6px;width:100%;
  border:1px solid rgba(42,36,25,.25);background:#fff;color:var(--ink)}
@media (max-width:640px){#dressWrap{grid-template-columns:1fr}#preview{min-height:220px}}

.meter{position:relative;height:40px;background:#EDE4D2;border:1px solid rgba(42,36,25,.2);border-radius:4px;margin:12px 0 6px;overflow:hidden}
.meter .band{position:absolute;top:0;bottom:0;background:rgba(46,122,102,.26);border-left:2px solid var(--jade);border-right:2px solid var(--jade)}
.meter .mk{position:absolute;top:0;bottom:0;width:4px;background:var(--oxide)}
.vmeter{position:relative;height:158px;width:66px;background:#EDE4D2;border:1px solid rgba(42,36,25,.2);border-radius:4px;overflow:hidden;margin:12px auto 6px}
.vmeter .band{position:absolute;left:0;right:0;background:rgba(233,185,73,.4);border-top:2px solid var(--gold);border-bottom:2px solid var(--gold)}
.vmeter .fill{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(#C08A4A,#7E5228)}
.scoreline{font-family:var(--mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:#7C7160;margin-top:8px}
.bolt{width:40px;height:40px;border-radius:5px;border:2px solid rgba(42,36,25,.2);cursor:pointer;padding:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(126px,1fr));gap:12px;margin-top:14px}
.cardCell{border:1px solid rgba(42,36,25,.16);border-radius:7px;padding:10px 8px 11px;background:#fff;text-align:center}
.cardCell.locked{background:#F2EADA;border-style:dashed;opacity:.7}
.cardCell .nm{font-size:12px;font-weight:700;margin-top:5px;line-height:1.28}
.cardCell .my2{font-family:var(--my);font-size:12px;color:#7C7160;line-height:1.65}
.cardCell .pr{font-family:var(--mono);font-size:9px;color:#96897A;margin-top:3px}
.cardCell .ghost{height:84px;display:flex;align-items:center;justify-content:center;font-family:var(--mono);
  font-size:9px;letter-spacing:.12em;color:#A89C87;text-transform:uppercase}

.mapGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin-top:14px}
.mapCell{text-align:left;padding:14px 15px;border:1px solid rgba(42,36,25,.2);border-radius:7px;background:#fff;
  cursor:pointer;transition:.14s;font-family:var(--sans);color:var(--ink)}
.mapCell:hover{border-color:var(--oxide);transform:translateY(-2px)}
.mapCell[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.mapCell .mt{font-family:var(--display);font-size:17px;line-height:1.15}
.mapCell .mm{font-family:var(--my);font-size:13px;color:var(--oxide);line-height:1.8}
.mapCell .md{font-size:11.5px;color:#7C7160;line-height:1.4;margin-top:4px}
.mapCell .mk2{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:#96897A;margin-top:6px}
.mapCell.here{background:#FBEDE4;border-color:var(--oxide)}

#photoList{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.pRow{display:flex;gap:10px;align-items:center;padding:9px 11px;border:1px solid rgba(42,36,25,.16);border-radius:6px;background:#fff;flex-wrap:wrap}
.pRow .pn{flex:1 1 150px;font-size:13.5px;font-weight:700}
.pRow .has{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--jade)}
input[type=file]{font-family:var(--sans);font-size:11.5px;max-width:196px}

#endScrim{background:rgba(10,8,14,.5);backdrop-filter:blur(2px)}
#endScrim .panel{background:rgba(16,14,20,.9);color:#EFE9DC;border:1px solid rgba(243,235,218,.16);
  box-shadow:0 30px 90px rgba(0,0,0,.7)}
#endScrim h2{color:#F3EBDA}
#endScrim .kick{color:var(--gold)}
#endScrim p{color:#CDD3D6}
#endScrim p.say{font-family:var(--display);font-size:20px;line-height:1.55;color:#F3EBDA}
#endScrim .cardCell{background:#1B2027;border-color:rgba(243,235,218,.14);color:#EFE9DC}
#endScrim .cardCell.locked{background:#141920}
#endScrim .cardCell .my2,#endScrim .cardCell .pr{color:#8B949B}
#endScrim .btn{color:#EFE9DC;border-color:rgba(243,235,218,.3)}
#endScrim .btn.go{background:var(--gold);color:#1A1407;border-color:var(--gold)}
@media (max-width:700px){#bar{padding:9px 10px}#place{top:52px;left:11px}#hint{display:none}}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms !important}}
</style>

<div id="stage"><svg id="scene" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice"></svg></div>

<div id="hud">
  <div id="bar">
    <div id="barL">
      <div class="pill who"><span class="k">You</span><span class="v" id="whoName">·</span></div>
      <div class="pill"><span class="k">Time</span><span class="v" id="clock">06:00</span></div>
      <div class="pill money" id="kyatPill"><span class="k">Kyat</span><span class="v" id="kyat">0</span></div>
    </div>
    <div id="barR">
      <button class="hbtn" id="mapBtn">Where to · <b>M</b></button>
      <button class="hbtn" id="cardBtn">Card · <b id="cardN">0/12</b></button>
      <button class="hbtn" id="photoBtn">Photos</button>
      <button class="hbtn" id="sndBtn">Sound off</button>
      <button class="hbtn" id="endBtn">End the day</button>
    </div>
  </div>
  <div id="place"><div class="t" id="plT">·</div><div class="m" id="plM"></div><div class="s" id="plS"></div></div>
  <div id="prompt"></div>
  <div id="acts"></div>
  <div id="hint">← → or A D to walk &nbsp;·&nbsp; click to go there &nbsp;·&nbsp; E to use what you are standing at &nbsp;·&nbsp; M for the map</div>
  <div id="toast"></div>
</div>

<div class="scrim" id="modal"><div class="panel" id="panel"></div></div>
<div class="scrim" id="cardScrim"><div class="panel wide" id="cardPanel"></div></div>
<div class="scrim" id="mapScrim"><div class="panel wide" id="mapPanel"></div></div>
<div class="scrim" id="photoScrim"><div class="panel" id="photoPanel"></div></div>
<div class="scrim" id="endScrim"><div class="panel wide" id="endPanel"></div></div>
<div class="scrim on" id="intro"><div class="panel wide" id="introPanel"></div></div>

<script>
(function(){
"use strict";
var VW=1600,VH=900;
var $=function(i){return document.getElementById(i);};
/* seeded randomness: reset per scene build so nothing shimmers between frames */
var _seed=1;
function seedFor(k){_seed=0;for(var i=0;i<k.length;i++)_seed=(_seed*31+k.charCodeAt(i))>>>0;_seed=(_seed||7)+9973;}
function rnd(a,b){_seed=(_seed*1664525+1013904223)>>>0;return a+(_seed/4294967296)*(b-a);}
function pick(a){return a[Math.floor(rnd(0,a.length))%a.length];}
function el(t,a,k){var s='<'+t;for(var p in a){if(a[p]!=null)s+=' '+p+'="'+a[p]+'"';}return k!==undefined?s+'>'+k+'</'+t+'>':s+'/>';}
function rect(x,y,w,h,f,e){return el('rect',Object.assign({x:x,y:y,width:w,height:h,fill:f},e||{}));}
function circ(x,y,r,f,e){return el('circle',Object.assign({cx:x,cy:y,r:r,fill:f},e||{}));}
function tx(x,y,s,o){return el('text',Object.assign({x:x,y:y,fill:'#fff','font-size':20,'text-anchor':'middle'},o||{}),s);}
/* Burmese needs real text shaping, which SVG <text> does not do reliably.
   Render it as HTML inside a foreignObject so the glyphs join properly. */
function myTx(x,y,s,size,color,weight,anchor,opacity){
  size=size||20;
  var w=1400, left=(anchor==='start')?x:x-w/2, ta=(anchor==='start')?'left':'center';
  return el('foreignObject',{x:left,y:y-size*1.25,width:w,height:size*2.4,style:'overflow:visible;pointer-events:none'},
    '<div xmlns="http://www.w3.org/1999/xhtml" style="font-family:\'Noto Sans Myanmar\',\'Padauk\',\'Myanmar Text\',sans-serif;'+
    'font-size:'+size+'px;line-height:1.6;color:'+color+';text-align:'+ta+';font-weight:'+(weight||600)+
    ';opacity:'+(opacity==null?1:opacity)+';white-space:nowrap;pointer-events:none">'+s+'</div>');
}
function money(n){return n.toLocaleString('en-US');}
function esc(s){return String(s).replace(/[<>&"]/g,function(c){return{'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c];});}
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v);}catch(e){return null;}}

var K={bone:'#F3EBDA',boneDim:'#E0D3B8',boneShade:'#BFAE8E',oxide:'#A8392E',oxideHi:'#C2503F',
  brick:'#C6552B',brickTrim:'#E8C46A',jade:'#2E7A66',gold:'#E9B949',goldHi:'#F7DA8C',goldDeep:'#B98A22',
  concrete:'#8A929C',tree:'#3E7A46',treeHi:'#56A05C',neon:'#7BE08A'};

/* ===================== DISHES ===================== */
var DISHES=[
 {id:'mohinga',en:'Mohinga',my:'မုန့်ဟင်းခါး',price:1500,until:9*60,
  taste:'Catfish broth thick with banana stem, thin rice noodles, a crushed gourd fritter, half a boiled egg, lime.',
  line:'Breakfast standing up with your elbow out, the bowl far too hot to be holding, and you hold it anyway because everyone around you is doing the same.'},
 {id:'nangyi',en:'Nan gyi thoke',my:'နန်းကြီးသုပ်',price:1800,
  taste:'Fat round noodles tossed by hand with chicken curry oil, chickpea flour, quail eggs, a lot of fried onion.',
  line:'You always said you could eat this cold, at three in the afternoon, standing at the counter.'},
 {id:'samusa',en:'Samusa thoke',my:'ဆမူဆာသုပ်',price:1500,
  taste:'Samosas broken up and drowned in a thin sour curry, raw onion and cabbage piled on top.',
  line:'Somebody, once, had samosas left over and decided to do this to them instead of throwing them away. Everyone has been grateful ever since.'},
 {id:'laphet',en:'Laphet thoke',my:'လက်ဖက်သုပ်',price:2000,
  taste:'Pickled tea leaves in the middle, then peanuts, broad beans, sesame, fried garlic, dried shrimp, tomato.',
  line:'You mix it yourself with your fingers, slowly, the way you were shown when you were small and it kept you at the table longer than you wanted.'},
 {id:'ngapi',en:'Nga pi yay',my:'ငါးပိရည်',price:1200,
  taste:'A thin fish-paste broth to dip into, with raw and blanched vegetables, cucumber, okra, small green aubergines.',
  line:'The smell is the whole argument. If you grew up with it, it smells like everyone still sitting at the table.'},
 {id:'shan',en:'Shan khauk swe',my:'ရှမ်းခေါက်ဆွဲ',price:1800,
  taste:'Flat rice noodles in a light tomato-and-pork broth, or tossed dry with pickled mustard greens on the side.',
  line:'You ask for it dry, and drink the soup on its own afterwards, which is a small thing you have never once had to explain to anyone here.'},
 {id:'kyayoh',en:'Kyay oh',my:'ကြေးအိုး',price:2200,
  taste:'Noodles, pork and quail eggs brought to the table still boiling in its own brass pot.',
  line:'Ordered after midnight by people who should have gone home two hours ago.'},
 {id:'ohnno',en:'Ohn no khauk swe',my:'အုန်းနို့ခေါက်ဆွဲ',price:2000,
  taste:'Wheat noodles in coconut chicken broth gone thick and yellow, crispy noodles on top, egg, chilli oil, lime.',
  line:'Too rich for breakfast, and everybody eats it for breakfast.'},
 {id:'montphet',en:'Mont phet htoke',my:'မုန့်ဖက်ထုပ်',price:800,
  taste:'Steamed sticky rice and palm sugar, dense as a brick, cut into slabs on a banana leaf.',
  line:'Sweet enough that one piece is plenty, and you will eat three.'},
 {id:'montlin',en:'Mont lin ma yar',my:'မုန့်လင်မယား',price:1000,
  taste:'Batter cooked in a dimpled iron pan, quail egg and spring onion inside, two halves pressed together.',

/* ===================== RENDER ===================== */
var t0=performance.now();
function render(){
  var t=(performance.now()-t0)/1000;
  if(S.scene==='candles'){ $('scene').innerHTML=candleScene(t); return; }
  if(S.scene==='served'){ $('scene').innerHTML=servedScene(t); return; }
  var sc=SCENES[S.scene];
  $('scene').innerHTML = sc.kind==='out'?outScene(S.scene,t):inScene(S.scene,t);
}

/* ===================== HUD ===================== */
var toastT;
function toast(m){$('toast').innerHTML=m;$('toast').classList.add('on');
  clearTimeout(toastT);toastT=setTimeout(function(){$('toast').classList.remove('on');},4200);}
function fmt(m){return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');}
function earn(n){S.kyat+=n;var p=$('kyatPill');p.classList.add('flash');setTimeout(function(){p.classList.remove('flash');},700);refresh();}
function addTime(n){S.minutes+=n;if(S.minutes>=19*60&&!S.ended)forceEnd();refresh();}
function refresh(){
  $('clock').textContent=fmt(S.minutes);$('kyat').textContent=money(S.kyat);
  $('whoName').textContent=S.me.name||'·';
  $('cardN').textContent=Object.keys(S.eaten).length+'/'+DISHES.length;
  var sc=SCENES[S.scene];
  $('plT').textContent=sc.t;$('plM').textContent=sc.my;$('plS').textContent=sc.s;
}
function openPanel(h){$('panel').innerHTML=h;$('modal').classList.add('on');
  $('panel').querySelectorAll('[data-close]').forEach(function(b){b.onclick=function(){$('modal').classList.remove('on');};});}

/* ===================== ACTIONS BAR (interiors) ===================== */
function refreshActs(){
  var a=$('acts'),sc=SCENES[S.scene];
  if(!sc||sc.kind!=='in'||S.ended){a.classList.remove('on');a.innerHTML='';return;}
  var sh=INSHOP[S.scene],h='';
  sh.sells.forEach(function(id){
    var d=dishById(id),had=S.eaten[id],gone=d.until&&S.minutes>d.until;
    h+='<button class="act'+(had||gone?'':' go')+'" data-eat="'+id+'"'+(had||gone||S.kyat<d.price?' disabled':'')+'>'+
      (had?'✓ '+d.en:(gone?d.en+', gone':d.en+' · '+money(d.price)))+'</button>';});
  if(sh.job) h+='<button class="act" data-job="'+sh.job+'"'+(S.jobsDone[sh.job]?' disabled':'')+'>'+
    (S.jobsDone[sh.job]?'Shift done':'Ask for a shift')+'</button>';
  h+='<button class="act" id="outBtn">Out to the street</button>';
  a.innerHTML=h;a.classList.add('on');
  a.querySelectorAll('[data-eat]').forEach(function(b){b.onclick=function(){eat(b.dataset.eat);};});
  a.querySelectorAll('[data-job]').forEach(function(b){b.onclick=function(){JOBS[b.dataset.job]();};});
  $('outBtn').onclick=function(){goTo(S.scene==='tea'?'street':'sule',true);};
}

/* ===================== TRAVEL ===================== */
function goTo(k,quick){
  $('stage').classList.add('fading');
  setTimeout(function(){
    S.scene=k;S.x=SCENES[k].kind==='out'?200:0;S.walkTo=null;
    if(!quick)addTime(20);
    render();refresh();refreshActs();ambient(k);
    $('stage').classList.remove('fading');
    $('mapScrim').classList.remove('on');
  },460);
}

}
function noiseBuf(){
  var len=AC.sampleRate*2,b=AC.createBuffer(1,len,AC.sampleRate),d=b.getChannelData(0);
  for(var i=0;i<len;i++)d[i]=(Math.random()*2-1);
  return b;
}
var bedNode=null,pingTimer=null;
function ambient(k){
  if(!S.sound||!ensureAudio())return;
  if(bedNode){try{bedNode.src.stop();}catch(e){}try{if(bedNode.pad)bedNode.pad.stop();}catch(e){}bedNode=null;}
  clearInterval(pingTimer);
  var cfg={street:{lp:760,hp:80,g:.09,ping:'horn'},sule:{lp:1150,hp:95,g:.13,ping:'horn'},
    tea:{lp:2000,hp:340,g:.05,ping:'clink'},zay:{lp:1300,hp:220,g:.07,ping:'chat'},
    rice:{lp:1700,hp:260,g:.05,ping:'clink'},shan:{lp:1800,hp:280,g:.055,ping:'clink'},
    shwe:{lp:520,hp:50,g:.035,ping:'bell'},candles:{lp:460,hp:40,g:.03,ping:'bell'}}[k]||{lp:900,hp:90,g:.07,ping:'horn'};
  var src=AC.createBufferSource();src.buffer=noiseBuf();src.loop=true;
  var hp=AC.createBiquadFilter();hp.type='highpass';hp.frequency.value=cfg.hp;
  var lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=cfg.lp;
  var g=AC.createGain();g.gain.value=cfg.g;
  src.connect(hp);hp.connect(lp);lp.connect(g);g.connect(master);src.start();
  bedNode={src:src,g:g};
  pingTimer=setInterval(function(){
    if(!S.sound||!AC)return;
    var o=AC.createOscillator(),og=AC.createGain();
    var now=AC.currentTime;
    var lp2=AC.createBiquadFilter();lp2.type='lowpass';lp2.frequency.value=2400;
    if(cfg.ping==='horn'){o.type='triangle';o.frequency.value=rnd(150,260);og.gain.setValueAtTime(.028,now);
      og.gain.exponentialRampToValueAtTime(.001,now+.5);lp2.frequency.value=900;}
    else if(cfg.ping==='clink'){o.type='sine';o.frequency.value=rnd(900,1700);og.gain.setValueAtTime(.026,now);
      og.gain.exponentialRampToValueAtTime(.001,now+.5);}
    else if(cfg.ping==='bell'){o.type='sine';o.frequency.value=[392,494,587,659][Math.floor(rnd(0,4))%4];
      og.gain.setValueAtTime(.05,now);og.gain.exponentialRampToValueAtTime(.001,now+4.2);}
    else {o.type='sine';o.frequency.value=rnd(220,420);og.gain.setValueAtTime(.014,now);
      og.gain.exponentialRampToValueAtTime(.001,now+.45);}
    o.connect(lp2);lp2.connect(og);og.connect(master);o.start(now);o.stop(now+4.6);
  }, cfg.ping==='bell'?4200:cfg.ping==='chat'?1500:2600);
  /* a warm pad underneath, quiet */
  if(cfg.ping==='bell'){
    var pad=AC.createOscillator(),pg=AC.createGain();
    pad.type='sine';pad.frequency.value=98;pg.gain.value=.035;
    pad.connect(pg);pg.connect(master);pad.start();
    bedNode.pad=pad;
  }
}

var melTimer=null;
function playClosingMusic(){
  if(S.ownTrack){ try{ var a=new Audio(S.ownTrack); a.volume=.55; a.loop=true; S.ownAudio=a; a.play(); }catch(e){} return; }
  if(!S.sound||!ensureAudio())return;
  var NT={D4:293.66,E4:329.63,G4:392.00,A4:440.00,B4:493.88,D5:587.33,E5:659.25,G5:783.99,A3:220.00,D3:146.83};
  var phrase=[['D5',0,1.4],['B4',1.1,1.1],['A4',2.0,1.6],['G4',3.4,1.2],['E4',4.4,2.2],
              ['G4',6.6,1.2],['A4',7.6,1.2],['B4',8.6,1.8],['D5',10.2,2.6],
              ['A4',13.0,1.4],['G4',14.2,1.4],['E4',15.4,3.4]];
  var bass=[['D3',0,7],['A3',7,6],['D3',13,6.4]];
  function note(f,at,dur,gain,type){
    var o=AC.createOscillator(),g2=AC.createGain(),lp=AC.createBiquadFilter();
    lp.type='lowpass';lp.frequency.value=1900;
    o.type=type||'sine';o.frequency.value=f;
    var t0n=AC.currentTime+at;
    g2.gain.setValueAtTime(0,t0n);
    g2.gain.linearRampToValueAtTime(gain,t0n+.18);
    g2.gain.exponentialRampToValueAtTime(.0008,t0n+dur);
    o.connect(lp);lp.connect(g2);g2.connect(master);
    o.start(t0n);o.stop(t0n+dur+.2);
  }
  function cycle(){
    phrase.forEach(function(n){note(NT[n[0]],n[1],n[2],.055,'sine');});
    phrase.forEach(function(n){note(NT[n[0]]*2,n[1]+.06,n[2]*.7,.016,'triangle');});
    bass.forEach(function(n){note(NT[n[0]],n[1],n[2],.045,'sine');});
  }
  cycle();
  clearInterval(melTimer);
  melTimer=setInterval(function(){ if(S.sound&&AC) cycle(); }, 19400);
}

        '<div class="dim" style="line-height:1.55">'+s.b+'</div></div></div>';}).join('')+
    '</div>'+
    '<div style="margin-top:20px;padding-top:14px;border-top:1px solid rgba(42,36,25,.18)">'+
    '<div class="scoreline" style="margin:0 0 8px">Controls</div>'+
    '<div class="dim" style="line-height:1.7">'+
    '<b>← →</b> or <b>A D</b> walk · <b>click</b> to go there · <b>E</b> use what you are standing at<br>'+
    '<b>M</b> map and travel · <b>F</b> food card · <b>Sound</b> for the street · <b>Photos</b> to put your own Yangon behind the scenes'+
    '</div></div>'+
    '<div class="row" style="margin-top:20px"><button class="btn go" id="reallyStart">Six in the morning, go</button>'+
    '<button class="btn" id="backDress">Change what I am wearing</button></div>';
  $('reallyStart').onclick=function(){
    $('intro').classList.remove('on');
    toast('<b>'+esc(S.me.name)+'</b>, nothing in your pocket. The tea shop is up the street and it is hiring.');
    setTimeout(function(){$('hint').style.opacity='0';},12000);};
  $('backDress').onclick=intro;
}

/* ===================== INPUT & LOOP ===================== */
var keys={};
window.addEventListener('keydown',function(e){
  if(e.target.tagName==='INPUT')return;
  var k=e.key.toLowerCase();keys[k]=true;
  if(k==='m'){$('mapScrim').classList.contains('on')?$('mapScrim').classList.remove('on'):openMap();}
  if(k==='f'){$('cardScrim').classList.contains('on')?$('cardScrim').classList.remove('on'):openCard();}
  if(k==='escape'){['modal','cardScrim','mapScrim','photoScrim'].forEach(function(i){$(i).classList.remove('on');});}
  if(k==='e'){var s=nearSpot();if(s&&!busy()&&!S.ended)useSpot(s);}
  if(k===' ')e.preventDefault();
});
window.addEventListener('keyup',function(e){keys[e.key.toLowerCase()]=false;});
$('stage').addEventListener('click',function(e){
  if(busy()||!SCENES[S.scene]||SCENES[S.scene].kind!=='out')return;
  var W=SCENES[S.scene].w,pan=Math.max(0,Math.min(W-VW,S.x-VW/2));
  var sc2=Math.max(window.innerWidth/VW,window.innerHeight/VH),visW=window.innerWidth/sc2;
  S.walkTo=Math.max(60,Math.min(W-60,(VW-visW)/2+(e.clientX/window.innerWidth)*visW+pan));
});
function busy(){return ['modal','cardScrim','mapScrim','photoScrim','intro','endScrim'].some(function(i){return $(i).classList.contains('on');});}
function nearSpot(){
  var l=SPOTS[S.scene]||[];
  for(var i=0;i<l.length;i++)if(Math.abs(S.x-l[i].x)<95)return l[i];
  return null;
}
function useSpot(sp){
  S.walkTo=null;
  if(sp.end){ending(false);return;}
  if(sp.go){goTo(sp.go);return;}
  if(sp.job){JOBS[sp.job]();return;}
  if(sp.sells){
    var rows=sp.sells.map(function(id){
      var d=dishById(id),had=S.eaten[id],gone=d.until&&S.minutes>d.until;
      return '<div class="menuRow"><div>'+dishArt(id,72)+'</div><div class="txt">'+
        '<p class="myn">'+d.my+'</p><div class="en">'+d.en+'</div><div class="ds">'+d.taste+'</div></div>'+
        '<div class="act2"><div class="scoreline" style="margin:0 0 6px">'+money(d.price)+' kyat</div>'+
        (had?'<span class="scoreline" style="color:#2E7A4E">eaten ✓</span>'
          :gone?'<span class="scoreline" style="color:#B9503F">gone by nine</span>'
          :'<button class="btn go sm" data-eat="'+id+'"'+(S.kyat<d.price?' disabled':'')+'>'+(S.kyat<d.price?'No kyat':'Order it')+'</button>')+
        '</div></div>';}).join('');
    openPanel('<p class="kick">'+SCENES[S.scene].t+'</p><h2 class="my">'+sp.my+'</h2>'+
      '<p class="dim" style="margin-top:-4px">'+sp.label+'</p>'+rows+
      '<div class="row" style="margin-top:14px"><button class="btn" data-close>Walk on</button></div>');
    $('panel').querySelectorAll('[data-eat]').forEach(function(b){b.onclick=function(){eat(b.dataset.eat);};});
  }
}
function loop(){
  requestAnimationFrame(loop);
  var sc=SCENES[S.scene];
  if(sc && sc.kind==='out'){
    var sp=0;
    if(!busy()){
      if(keys['arrowright']||keys['d'])sp=1;
      else if(keys['arrowleft']||keys['a'])sp=-1;
      else if(S.walkTo!==null){var d=S.walkTo-S.x;if(Math.abs(d)<6)S.walkTo=null;else sp=d>0?1:-1;}
    }
    if(sp!==0){S.x=Math.max(60,Math.min(sc.w-60,S.x+sp*4));S.facing=sp;S.step+=0.2;}
    else S.step*=0.86;
    var st=nearSpot(),p=$('prompt');
    if(st&&!busy()&&!S.ended){
      p.innerHTML=st.label+', <b>E</b> to '+(st.end?'go up':st.go?'go in':st.job?'ask for work':'see what there is');
      p.classList.add('on');
    } else p.classList.remove('on');
  }
  var now=performance.now();
  if(now-lastDraw>42){ lastDraw=now; render(); }
}
var lastDraw=0;

intro();refresh();refreshActs();loop();
})();
</script>
